output: dist/

# 统一产物命名，例如:
#   macOS:   ProxyPin-1.3.1-macos.dmg
#   Windows: ProxyPin-1.3.1-windows.zip / .exe / .msix
# 可用变量: {{name}} {{build_name}} {{build_number}} {{version}} {{build_mode}} {{platform}} {{ext}}
# 注意: 仅 `flutter_distributor release` 会读取此配置;
#       `flutter_distributor package` 子命令需用 --artifact-name 显式指定。
artifact_name: "ProxyPin-{{build_name}}-{{platform}}.{{ext}}"

releases:
  - name: release
    jobs:
      - name: macos-dmg
        package:
          platform: macos
          target: dmg

      - name: windows-exe
        package:
          platform: windows
          target: exe

      - name: windows-msix
        package:
          platform: windows
          target: msix

      - name: windows-zip
        package:
          platform: windows
          target: zip
